<!-- BLOCO 1: ESTRUTURA BÁSICA DA PÁGINA                     -->
<!-- ======================================================= -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="cadastroEquipamentos">Cadastro de Equipamentos - SIGEM</title>

    <!-- Importação dos estilos CSS (Caminhos locais corretos) -->
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/dark.css">
    <link rel="stylesheet" href="styles/pequeno.css">
    <link rel="stylesheet" href="styles/grande.css" media="screen and (min-width: 900px)">
    <link rel="stylesheet" href="styles/cadastro.css">
</head>
<body>

    <main class="cadastro-container">

        <!-- Cabeçalho de navegação e seleção de idioma -->
        <header class="header-cadastro">
            <a href="../../index.html" class="btn-voltar">&larr; Voltar ao Módulo</a>
            
            <div class="seletor-idioma">
                <select id="idioma">
                    <option value="pt-BR">🇧🇷 Português</option>
                    <option value="en-US">🇺🇸 English</option>
                    <option value="es-ES">🇪🇸 Español</option>
                </select>
            </div>
        </header>

        <!-- Título principal e subtítulo institucional -->
        <h1 data-i18n="cadastroEquipamentos">Cadastro de Equipamentos</h1>
        <p class="subtitulo">Registro e gerenciamento de equipamentos médico-hospitalares.</p>

        <!-- Formulário Principal contendo todos os Blocos de 2 a 6 -->
        <form id="cadastroForm">

            <!-- ======================================================= -->
            <!-- BLOCO 2: DADOS DA SOLICITAÇÃO                           -->
            <!-- ======================================================= -->
            <section class="bloco-formulario">
                <h2 data-i18n="dadosSolicitacao">Dados da Solicitação</h2>

                <div class="campo-grupo">
                    <label for="status" data-i18n="status">Status *</label>
                    <select id="status" name="status" required>
                        <option value="Ativo">Ativo</option>
                        <option value="Inativo">Inativo</option>
                        <option value="Em Implantação">Em Implantação</option>
                    </select>
                </div>

                <div class="campo-grupo">
                    <label for="dataSolicitacao" data-i18n="dataSolicitacao">Data da Solicitação *</label>
                    <input type="date" id="dataSolicitacao" name="dataSolicitacao" required>
                </div>

                <div class="campo-grupo">
                    <label for="solicitante" data-i18n="solicitante">Nome do Solicitante *</label>
                    <input type="text" id="solicitante" name="solicitante" placeholder="Digite o nome do solicitante" required>
                </div>
            </section>

            <!-- ======================================================= -->
            <!-- BLOCO 3: LOCALIZAÇÃO (REGIONAL E UNIDADE)               -->
            <!-- ======================================================= -->
            <section class="bloco-formulario">
                <h2 data-i18n="localizacao">Localização</h2>

                <div class="campo-grupo">
                    <label for="regional" data-i18n="regional">Regional *</label>
                    <select id="regional" name="regionalId" required>
                        <option value="">Selecione a Regional...</option>
                    </select>
                </div>

                <div class="campo-grupo">
                    <label for="unidade" data-i18n="unidade">Unidade / Hospital *</label>
                    <select id="unidade" name="unidadeId" required>
                        <option value="">Selecione a Unidade...</option>
                        <option value="OUTRA" data-i18n="outraUnidadeOpcao">Outra Unidade (Digitar manualmente)</option>
                    </select>
                </div>

                <!-- Campo Condicional para Unidade Personalizada -->
                <div class="campo-grupo" id="grupoOutraUnidade" style="display: none;">
                    <label for="unidadePersonalizada" data-i18n="digiteOutraUnidade">Digite o nome da unidade:</label>
                    <input type="text" id="unidadePersonalizada" name="unidadePersonalizada" placeholder="Nome da nova unidade ou hospital">
                </div>
            </section>

            <!-- ======================================================= -->
            <!-- BLOCO 4: DADOS DO EQUIPAMENTO                           -->
            <!-- ======================================================= -->
            <section class="bloco-formulario">
                <h2 data-i18n="dadosEquipamento">Dados do Equipamento</h2>

                <div class="campo-grupo">
                    <label for="descricaoAtivo" data-i18n="descricaoAtivo">Descrição do Ativo *</label>
                    <input type="text" id="descricaoAtivo" name="descricaoAtivo" maxlength="150" placeholder="Ex: Monitor Multiparâmetro / Tomógrafo" required>
                </div>

                <div class="campo-grupo">
                    <label for="ativoPai" data-i18n="ativoPai">Ativo Pai</label>
                    <input type="text" id="ativoPai" name="ativoPai" placeholder="Ex: LSSPLS4-00 (Opcional se for equipamento principal)">
                </div>

                <div class="campo-grupo">
                    <label for="setorInstalacao" data-i18n="setorInstalacao">Setor de Instalação *</label>
                    <input type="text" id="setorInstalacao" name="setorInstalacao" placeholder="Ex: UTI Adulto / Centro Cirúrgico / Recepção" required>
                </div>

                <div class="campo-grupo">
                    <label for="numeroSerie" data-i18n="numeroSerie">Número de Série *</label>
                    <input type="text" id="numeroSerie" name="numeroSerie" placeholder="Ex: MP-123456" autocomplete="off" required>
                </div>
            </section>

            <!-- ======================================================= -->
            <!-- BLOCO 5: DADOS ADMINISTRATIVOS                          -->
            <!-- ======================================================= -->
            <section class="bloco-formulario">
                <h2 data-i18n="dadosAdministrativos">Dados Administrativos</h2>

                <div class="campo-grupo">
                    <label for="dataAquisicao" data-i18n="dataAquisicao">Data de Aquisição / Instalação *</label>
                    <input type="date" id="dataAquisicao" name="dataAquisicao" required>
                </div>

                <div class="campo-grupo">
                    <label for="classificacaoContabil" data-i18n="classificacaoContabil">Classificação Contábil *</label>
                    <input type="text" id="classificacaoContabil" name="classificacaoContabil" placeholder="Ex: Equipamento Médico-Hospitalar / Imobilizado" required>
                </div>

                <div class="campo-grupo">
                    <label for="notaFiscal" data-i18n="notaFiscal">Nota Fiscal *</label>
                    <input type="text" id="notaFiscal" name="notaFiscal" placeholder="Ex: NF-10001" maxlength="50" autocomplete="off" required>
                </div>
            </section>

            <!-- ======================================================= -->
            <!-- BLOCO 6: BOTÕES DE AÇÃO                                 -->
            <!-- ======================================================= -->
            <section class="acoes-formulario">
                <button type="submit" class="btn-salvar" data-i18n="salvar">💾 Salvar Cadastro</button>
                <button type="reset" class="btn-limpar" data-i18n="limpar">🧹 Limpar</button>
            </section>

        </form>

    </main>

    <!-- Importação dos Scripts JS dentro da mesma pasta -->
    <script src="scripts/regionais.js"></script>
    <script src="scripts/unidades.js"></script>
    <script src="scripts/idiomas.js"></script>
    <script src="scripts/cadastro.js"></script>

</body>
</html>
